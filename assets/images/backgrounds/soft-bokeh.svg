<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="bokeh" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="35" cy="35" r="26" fill="#60a5fa" fill-opacity="0.18">
        <animate attributeName="r" values="26;32;26" dur="6s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.18;0.32;0.18" dur="6s" repeatCount="indefinite" />
      </circle>
      <circle cx="105" cy="95" r="34" fill="#a78bfa" fill-opacity="0.14">
        <animate attributeName="r" values="34;41;34" dur="7.5s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.14;0.28;0.14" dur="7.5s" begin="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="70" cy="120" r="16" fill="#f0abfc" fill-opacity="0.16">
        <animate attributeName="r" values="16;22;16" dur="5s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="120" cy="30" r="12" fill="#7dd3fc" fill-opacity="0.2">
        <animate attributeName="r" values="12;17;12" dur="6.5s" begin="1.8s" repeatCount="indefinite" />
      </circle>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 140 0" dur="22s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0b1220" />
  <rect width="100%" height="100%" fill="url(#bokeh)" />
</svg>